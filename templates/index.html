<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden Guide</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .chat-container {
      width: 100%;
      max-width: 640px;
      height: 90vh;
      max-height: 720px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #2e7d32;
      color: #ffffff;
      padding: 16px 20px;
    }
    .chat-header h1 { font-size: 20px; }
    .chat-header p { font-size: 13px; opacity: 0.9; margin-top: 2px; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f9fbf9;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }
    .message.bot {
      align-self: flex-start;
      background: #e8f5e9;
      color: #1b3a1e;
      border-bottom-left-radius: 4px;
    }
    .message.user {
      align-self: flex-end;
      background: #2e7d32;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .message.error { background: #ffebee; color: #b71c1c; }

    .chat-input {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #e0e0e0;
      background: #ffffff;
    }
    .chat-input input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #c8e6c9;
      border-radius: 24px;
      font-size: 15px;
      outline: none;
    }
    .chat-input input:focus { border-color: #2e7d32; }
    .chat-input button {
      padding: 0 22px;
      border: none;
      border-radius: 24px;
      background: #2e7d32;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }
    .chat-input button:hover { background: #1b5e20; }
    .chat-input button:disabled { background: #9e9e9e; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🌱 Garden Guide</h1>
      <p>Ask me anything about gardening</p>
    </div>

    <div class="chat-messages" id="messages">
      <div class="message bot">
        Hello! I'm Garden Guide. Ask me about plants, soil, watering, pests, or anything gardening related. 🌻
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your gardening question..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const messagesBox = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    let history = [];

    // Escape HTML, then apply simple formatting (bold and bullet points)
    function formatText(text) {
      const safe = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return safe
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^\s*[*-]\s+/gm, "• ")
        .replace(/\n/g, "<br>");
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.innerHTML = formatText(text);
      messagesBox.appendChild(div);
      messagesBox.scrollTop = messagesBox.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      addMessage(message, "user");
      userInput.value = "";
      sendBtn.disabled = true;

      const typing = addMessage("Thinking...", "bot");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (response.ok) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot error");
        }
      } catch (error) {
        typing.remove();
        addMessage("Could not reach the server. Please try again.", "bot error");
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
